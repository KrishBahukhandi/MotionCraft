            "applicationCategory": "DesignApplication",
            "applicationSubCategory": "CSS animation editor",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript and a modern browser",
            "description": "A browser-based CSS animation studio. Design on a canvas, refine on a timeline with keyframes and bezier easing, and export production-ready CSS, SCSS, Tailwind, React, Vue, Svelte, Angular, styled-components, Emotion, Web Components or HTML.",

              "@type": "Offer",

              "Visual canvas with pan, zoom and smart snapping",
              "Keyframe timeline with per-property tracks",
              "Cubic-bezier curve editor with spring and bounce easing",
              "Nested animatable groups",
              "SVG path draw-on and motion-path animation",
              "Animatable clip-path and mask reveals",
              "CSS variable bindings",
              "60+ animation presets",
              "Export to 11 formats including CSS, Tailwind, React and Vue",
              "prefers-reduced-motion and WCAG flash warnings"
            ],
            "author": {
              "@type": "Person",
              "name": "Krish Bahukhandi"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://motioncraft.bahukhandi-labs.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is it really free? What's the catch?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Free, no account, no server. Everything runs and stays in your browser — your scenes autosave to localStorage."
                }
              },
              {
                "@type": "Question",
                "name": "Where do my files go?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Nowhere. MotionCraft has no backend. Your work is saved locally in your browser and exported files download straight to your machine."
                }
              },
              {
                "@type": "Question",
                "name": "Is the generated CSS production-ready?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. It favors transform and opacity, includes per-segment timing functions, bakes physics-based easings into keyframes, and can wrap everything in a prefers-reduced-motion guard."
                }
              },
              {
                "@type": "Question",
                "name": "How do springs and bounces work in pure CSS?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "CSS timing functions cannot express oscillation, so MotionCraft samples the physics curve and bakes it into intermediate keyframes — identical motion, zero JavaScript."
                }
              },
              {
                "@type": "Question",
                "name": "Can I use it for commercial projects?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Everything you create and export is yours, no attribution required."
                }
              }
            ]
          }
        ]
      }
    </script>

    <script>
      // Apply theme before paint to avoid flash
      try {
        var t = localStorage.getItem('mc-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
